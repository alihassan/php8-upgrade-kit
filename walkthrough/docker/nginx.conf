# Same app, two PHP versions. Upstreams resolve at request time, so nginx
# still starts when one PHP service is switched off.
resolver 127.0.0.11 valid=10s;

server {
    listen 8074;
    root /var/www/app/public;
    index index.php;
    set $php php74:9000;

    location / { try_files $uri $uri/ /index.php?$query_string; }
    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_pass $php;
    }
}

server {
    listen 8083;
    root /var/www/app/public;
    index index.php;
    set $php php83:9000;

    location / { try_files $uri $uri/ /index.php?$query_string; }
    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_pass $php;
    }
}
