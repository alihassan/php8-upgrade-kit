name: False positive
description: The checker flagged code that is fine on the PHP version you chose.
labels: [false-positive]
body:
  - type: input
    id: rule
    attributes:
      label: Rule id
      description: Shown at the end of each finding in the Markdown report, e.g. null-to-internal.
    validations:
      required: true
  - type: dropdown
    id: target
    attributes:
      label: Target PHP version
      options: ['8.0', '8.1', '8.2', '8.3', '8.4']
    validations:
      required: true
  - type: textarea
    id: code
    attributes:
      label: Smallest code that reproduces it
      description: Please remove anything private. A few lines is ideal.
      render: php
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why it's fine
      description: For example, "the variable is checked with is_string() two lines above", or a link to the PHP docs.
